<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライブ配信用 超ド派手カスタムルーレット</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Zen Maru Gothic', sans-serif;
            background: #090a0f;
            color: #ffffff;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .glass-panel {
            background: rgba(18, 20, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(168, 85, 247, 0.6);
        }
        @keyframes popUp {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-pink-500 selection:text-white relative">

    <div class="absolute top-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <header class="w-full max-w-md text-center py-3 z-10 flex items-center justify-between px-2">
        <div>
            <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent neon-text text-left">
                ✨ LIVE ROULETTE ✨
            </h1>
            <p class="text-[10px] text-gray-400 text-left">音声読み上げ対応版</p>
        </div>
        <!-- 音声テスト用ボタン -->
        <button onclick="testSpeech()" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[10px] text-gray-300 border border-white/10">
            🔊 音声テスト
        </button>
    </header>

    <main class="w-full max-w-md flex flex-col items-center gap-6 z-10 mb-6">
        
        <div class="relative w-80 h-80 flex items-center justify-center">
            <!-- 針（上部中央） -->
            <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-30 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">
                <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[28px] border-t-red-500"></div>
            </div>
            
            <div class="relative w-72 h-72 rounded-full p-2 glass-panel neon-glow flex items-center justify-center shadow-2xl">
                <canvas id="rouletteCanvas" width="280" height="280" class="w-full h-full rounded-full cursor-pointer transition-transform duration-75"></canvas>
                <button id="centerSpinBtn" onclick="startSpin()" class="absolute w-20 h-20 rounded-full bg-gradient-to-tr from-pink-600 via-purple-600 to-indigo-600 font-extrabold text-sm text-white shadow-[0_0_20px_rgba(236,72,153,0.6)] hover:scale-105 active:scale-95 transition-all flex flex-col items-center justify-center z-20 border-2 border-white/30">
                    <span class="text-xs tracking-widest opacity-80">START</span>
                    <span class="text-base">回す！</span>
                </button>
            </div>
        </div>

        <div class="w-full flex gap-3 px-2">
            <button onclick="startSpin()" class="flex-1 py-3 px-4 rounded-xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 active:scale-98 shadow-[0_0_20px_rgba(236,72,153,0.4)] transition-all text-sm tracking-wide">
                🚀 ルーレットを回す (Space)
            </button>
            <button onclick="resetEliminated()" class="px-4 py-3 rounded-xl font-bold glass-panel hover:bg-white/10 active:scale-98 transition-all text-xs text-gray-300">
                🔄 復活
            </button>
        </div>

        <div class="w-full glass-panel rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
            <h2 class="text-sm font-bold text-gray-200 flex items-center justify-between">
                <span>📋 選択肢と大きさ（重み）の調整</span>
                <span id="itemCount" class="text-xs px-2 py-0.5 rounded-full bg-purple-500/30 text-purple-300 border border-purple-500/40">0件</span>
            </h2>

            <div class="flex gap-2">
                <input type="text" id="newItemName" placeholder="項目名 (例: 当たり！)" class="flex-1 bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500 transition-colors">
                <input type="number" id="newItemWeight" value="1" min="1" max="100" title="重み(大きさ)" class="w-16 bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm text-center focus:outline-none focus:border-pink-500 transition-colors">
                <button onclick="addItem()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg transition-all">
                    追加
                </button>
            </div>

            <div id="itemList" class="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1"></div>
        </div>

    </main>

    <!-- 結果ポップアップ＆花火モーダル -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <canvas id="fireworksCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
        <div id="modalContent" class="glass-panel neon-glow rounded-3xl p-8 max-w-sm w-full text-center flex flex-col items-center gap-5 animate-pop relative z-10 border border-pink-500/40 bg-gradient-to-b from-gray-900/90 to-purple-950/90">
            <div class="text-xs tracking-widest text-pink-400 font-bold uppercase">✨ RESULT ✨</div>
            <div id="resultText" class="text-4xl font-black text-white neon-text break-words w-full py-2"></div>
            <button onclick="closeResultModal()" class="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 shadow-[0_0_20px_rgba(236,72,153,0.6)] transition-all text-sm">
                閉じる (続ける)
            </button>
        </div>
    </div>

    <footer class="text-center text-[10px] text-gray-500 z-10">
        Live Stream Roulette App &copy; 2026
    </footer>

    <script>
        let items = [
            { id: 1, name: "大当たり！", weight: 3, color: "#ec4899", eliminated: false },
            { id: 2, name: "ハズレ…", weight: 2, color: "#8b5cf6", eliminated: false },
            { id: 3, name: "もう一回！", weight: 2, color: "#3b82f6", eliminated: false },
            { id: 4, name: "罰ゲーム", weight: 1, color: "#06b6d4", eliminated: false },
        ];

        let currentAngle = 0;
        let isSpinning = false;
        let targetAngle = 0;
        let startAngleVal = 0;
        let startTime = 0;
        let audioCtx = null;
        let fireworksAnimId = null;

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const colors = ["#ec4899", "#8b5cf6", "#3b82f6", "#06b6d4", "#10b981", "#f59e0b", "#ef4444", "#6366f1"];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.03);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        function playWinFanfare() {
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.4);
            });
        }

        // 確実な音声読み上げ関数
        function speakResult(text) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel(); // 既存の音声を停止
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.1;
            utterance.pitch = 1.0;

            // iOS (Safari) などの音声エンジン対策で一度空の音声を発火させるか、明示的に日本語音声を探す
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP');
            if (jpVoice) {
                utterance.voice = jpVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // テストボタン用
        function testSpeech() {
            initAudio();
            speakResult("音声読み上げのテストです。正常に動作しています。");
        }

        function drawRoulette() {
            const activeItems = items.filter(i => !i.eliminated);
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 8;

            ctx.clearRect(0, 0, width, height);

            if (activeItems.length === 0) {
                ctx.fillStyle = '#6b7280';
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                return;
            }

            const totalWeight = activeItems.reduce((sum, item) => sum + item.weight, 0);
            let startAngle = currentAngle;

            activeItems.forEach((item, index) => {
                const sliceAngle = (item.weight / totalWeight) * Math.PI * 2;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px sans-serif';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(item.name.length > 8 ? item.name.substring(0, 7) + '…' : item.name, radius - 15, 4);
                ctx.restore();

                startAngle = endAngle;
            });
        }

        function updateUI() {
            const listEl = document.getElementById('itemList');
            const countEl = document.getElementById('itemCount');
            listEl.innerHTML = '';
            countEl.textContent = `${items.length}件`;
            items.forEach((item) => {
                const row = document.createElement('div');
                row.className = `flex items-center justify-between gap-2 p-2 rounded-xl bg-black/30 border border-white/5 transition-opacity ${item.eliminated ? 'opacity-40' : ''}`;
                row.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <input type="color" value="${item.color}" onchange="updateItemColor(${item.id}, this.value)" class="w-6 h-6 rounded border-0 cursor-pointer bg-transparent">
                        <span class="text-sm font-medium truncate ${item.eliminated ? 'line-through text-gray-500' : 'text-gray-200'}">${item.name}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[10px] text-gray-400">重み:</span>
                        <input type="number" value="${item.weight}" min="1" max="100" onchange="updateItemWeight(${item.id}, this.value)" class="w-12 bg-black/50 border border-white/10 rounded-lg text-center text-xs py-1 text-white">
                        <button onclick="toggleEliminate(${item.id})" class="px-2 py-1 rounded-lg text-xs ${item.eliminated ? 'bg-green-600/40 text-green-300' : 'bg-yellow-600/30 text-yellow-300'} hover:opacity-80">${item.eliminated ? '復元' : '除外'}</button>
                        <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-300 px-1.5 py-1 text-xs">✕</button>
                    </div>`;
                listEl.appendChild(row);
            });
            drawRoulette();
        }

        function addItem() {
            const name = document.getElementById('newItemName').value.trim();
            const weight = parseInt(document.getElementById('newItemWeight').value) || 1;
            if (!name) return;
            items.push({ id: items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1, name, weight, color: colors[items.length % colors.length], eliminated: false });
            document.getElementById('newItemName').value = '';
            updateUI();
        }

        function deleteItem(id) { items = items.filter(i => i.id !== id); updateUI(); }
        function toggleEliminate(id) { const item = items.find(i => i.id === id); if (item) { item.eliminated = !item.eliminated; updateUI(); } }
        function resetEliminated() { items.forEach(i => i.eliminated = false); updateUI(); }
        function updateItemWeight(id, val) { const item = items.find(i => i.id === id); if (item) { item.weight = Math.max(1, parseInt(val) || 1); updateUI(); } }
        function updateItemColor(id, val) { const item = items.find(i => i.id === id); if (item) { item.color = val; drawRoulette(); } }

        function startSpin() {
            if (isSpinning) return;
            initAudio();
            const activeItems = items.filter(i => !i.eliminated);
            if (activeItems.length === 0) return;
            isSpinning = true;
            document.getElementById('centerSpinBtn').disabled = true;
            targetAngle = currentAngle + (5 + Math.random() * 5) * Math.PI * 2 + Math.random() * Math.PI * 2;
            startAngleVal = currentAngle;
            startTime = performance.now();
            requestAnimationFrame(animateSpin);
        }

        function animateSpin(currentTime) {
            const elapsed = currentTime - startTime;
            const duration = 4000;
            const progress = Math.min(elapsed / duration, 1);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            currentAngle = startAngleVal + (targetAngle - startAngleVal) * easeOut;
            
            if (Math.random() < 0.2) playTickSound();
            drawRoulette();

            if (progress < 1) {
                requestAnimationFrame(animateSpin);
            } else {
                isSpinning = false;
                document.getElementById('centerSpinBtn').disabled = false;
                determineWinner();
            }
        }

        function determineWinner() {
            const activeItems = items.filter(i => !i.eliminated);
            if (activeItems.length === 0) return;
            const totalWeight = activeItems.reduce((sum, item) => sum + item.weight, 0);
            
            const pointerAngle = -Math.PI / 2;
            let normalizedAngle = (pointerAngle - (currentAngle % (Math.PI * 2))) % (Math.PI * 2);
            if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

            let currentSliceStart = 0;
            for (let item of activeItems) {
                const sliceAngle = (item.weight / totalWeight) * Math.PI * 2;
                const currentSliceEnd = currentSliceStart + sliceAngle;
                
                if (normalizedAngle >= currentSliceStart && normalizedAngle < currentSliceEnd) {
                    showResultModal(item);
                    return;
                }
                currentSliceStart = currentSliceEnd;
            }
            showResultModal(activeItems[0]);
        }

        function showResultModal(item) {
            playWinFanfare();
            speakResult(item.name); // 読み上げ実行
            
            document.getElementById('resultText').textContent = item.name;
            document.getElementById('modalContent').style.borderColor = item.color;
            document.getElementById('resultModal').classList.remove('hidden');
            startFireworks();
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.add('hidden');
            stopFireworks();
        }

        function startFireworks() {
            const fwCanvas = document.getElementById('fireworksCanvas');
            const fwCtx = fwCanvas.getContext('2d');
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
            let particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: fwCanvas.width / 2,
                    y: fwCanvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    size: Math.random() * 4 + 2
                });
            }
            function loop() {
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.alpha -= 0.015;
                    if (p.alpha > 0) {
                        fwCtx.save();
                        fwCtx.globalAlpha = p.alpha;
                        fwCtx.fillStyle = p.color;
                        fwCtx.beginPath();
                        fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        fwCtx.fill();
                        fwCtx.restore();
                    }
                });
                fireworksAnimId = requestAnimationFrame(loop);
            }
            loop();
        }

        function stopFireworks() {
            if (fireworksAnimId) cancelAnimationFrame(fireworksAnimId);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                startSpin();
            }
        });

        updateUI();
    </script>
</body>
</html>
