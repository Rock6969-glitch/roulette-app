<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライブ配信用 超ド派手カスタムルーレット</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <!-- PWA用 マニフェスト -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090a0f">
    <style>
        body {
            font-family: 'Outfit', 'Zen Maru Gothic', sans-serif;
            background: #090a0f;
            color: #ffffff;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .glass-panel {
            background: rgba(18, 20, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(168, 85, 247, 0.6);
        }
        @keyframes popUp {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-pink-500 selection:text-white relative">

    <div class="absolute top-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- ヘッダー -->
    <header class="w-full max-w-4xl text-center py-2 z-10 flex flex-col md:flex-row items-center justify-between gap-3 px-3">
        <div>
            <h1 class="text-xl md:text-2xl font-black tracking-wider bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent neon-text text-left">
                ✨ LIVE ROULETTE ✨
            </h1>
            <p class="text-[10px] md:text-xs text-gray-400 text-left">PWA・オート連チャン・音声読み上げ対応</p>
        </div>

        <!-- 音声・効果音の切り替えスイッチ群 -->
        <div class="flex items-center gap-3 glass-panel px-3 py-2 rounded-xl text-xs">
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
                <input type="checkbox" id="soundToggle" checked class="w-4 h-4 rounded accent-pink-500 cursor-pointer">
                <span class="text-gray-300 font-bold">🔊 効果音</span>
            </label>
            <div class="w-[1px] h-4 bg-white/20"></div>
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
                <input type="checkbox" id="speechToggle" checked class="w-4 h-4 rounded accent-purple-500 cursor-pointer">
                <span class="text-gray-300 font-bold">🗣️ 読み上げ</span>
            </label>
            <button onclick="testSpeech()" class="ml-1 px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs text-gray-300 border border-white/10 transition-colors">
                テスト
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-4xl flex flex-col md:flex-row items-center md:items-start justify-center gap-6 z-10 my-auto py-2">
        
        <!-- 左カラム：ルーレット本体 ＋ アクションボタン -->
        <div class="flex flex-col items-center gap-4 w-full md:w-auto shrink-0">
            <div class="relative w-80 h-80 md:w-96 md:h-96 flex items-center justify-center">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-30 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[28px] border-t-red-500"></div>
                </div>
                
                <div class="relative w-72 h-72 md:w-88 md:h-88 rounded-full p-2.5 glass-panel neon-glow flex items-center justify-center shadow-2xl">
                    <canvas id="rouletteCanvas" width="340" height="340" class="w-full h-full rounded-full cursor-pointer transition-transform duration-75"></canvas>
                    <button id="centerSpinBtn" onclick="handleSpinClick()" class="absolute w-20 h-20 md:w-24 md:h-24 rounded-full bg-gradient-to-tr from-pink-600 via-purple-600 to-indigo-600 font-extrabold text-sm md:text-base text-white shadow-[0_0_20px_rgba(236,72,153,0.6)] hover:scale-105 active:scale-95 transition-all flex flex-col items-center justify-center z-20 border-2 border-white/30">
                        <span class="text-[10px] md:text-xs tracking-widest opacity-80">START</span>
                        <span class="text-base md:text-lg">回す！</span>
                    </button>
                </div>
            </div>

            <!-- アクションボタン群 -->
            <div class="w-full max-w-xs md:max-w-none flex flex-col gap-2 px-1">
                <div class="flex gap-2">
                    <button onclick="handleSpinClick()" class="flex-1 py-3 px-4 rounded-xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 active:scale-98 shadow-[0_0_20px_rgba(236,72,153,0.4)] transition-all text-xs md:text-sm tracking-wide">
                        🚀 通常スピン (Space)
                    </button>
                    <button onclick="resetEliminated()" class="px-4 py-3 rounded-xl font-bold glass-panel hover:bg-white/10 active:scale-98 transition-all text-xs md:text-sm text-gray-300">
                        🔄 復活
                    </button>
                </div>
                
                <!-- オート連チャン自由設定エリア -->
                <div class="flex flex-col gap-2 glass-panel p-3 rounded-xl">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-gray-200 font-bold">🔄 オート連チャン設定</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <!-- 回数入力 -->
                        <div class="flex items-center gap-1 bg-black/50 border border-white/10 rounded-lg px-2.5 py-1.5 flex-1">
                            <input type="number" id="autoCountInput" value="5" min="1" max="9999" class="w-12 bg-transparent text-center text-xs md:text-sm text-white focus:outline-none">
                            <span class="text-xs text-gray-400">回</span>
                        </div>
                        <!-- 無限モード切り替えボタン -->
                        <button id="infiniteToggleBtn" onclick="toggleInfiniteMode()" class="px-3 py-1.5 rounded-lg border border-white/10 text-xs font-bold text-gray-300 bg-black/40 hover:bg-white/10 transition-all shrink-0">
                            ∞ 無限: OFF
                        </button>
                        <!-- 自動スタート / 停止ボタン -->
                        <button id="autoSpinBtn" onclick="toggleAutoSpin()" class="bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold transition-all shrink-0">
                            自動スタート
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右カラム：選択肢の追加・編集パネル -->
        <div class="w-full max-w-md md:w-[420px] glass-panel rounded-2xl p-4 md:p-5 flex flex-col gap-3 shadow-xl">
            <h2 class="text-xs md:text-sm font-bold text-gray-200 flex items-center justify-between px-1">
                <span>📋 選択肢と重みの調整</span>
                <span id="itemCount" class="text-[10px] md:text-xs px-2.5 py-0.5 rounded-full bg-purple-500/30 text-purple-300 border border-purple-500/40">0件</span>
            </h2>

            <!-- 新規追加フォーム -->
            <div class="flex gap-2 items-center">
                <input type="text" id="newItemName" placeholder="項目名を入力" class="flex-1 min-w-0 bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-xs md:text-sm focus:outline-none focus:border-pink-500 transition-colors">
                <div class="flex items-center gap-1.5 bg-black/40 border border-white/10 rounded-xl px-2.5 py-2 shrink-0">
                    <span class="text-[10px] text-gray-400">重み</span>
                    <input type="number" id="newItemWeight" value="1" min="1" max="100" class="w-10 bg-transparent text-center text-xs md:text-sm text-white focus:outline-none">
                </div>
                <button onclick="addItem()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold shadow-lg transition-all shrink-0">
                    追加
                </button>
            </div>

            <!-- リスト一覧 -->
            <div id="itemList" class="flex flex-col gap-2 max-h-64 md:max-h-80 overflow-y-auto pr-1"></div>
        </div>

    </main>

    <!-- 結果ポップアップ＆花火モーダル -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <canvas id="fireworksCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
        <div id="modalContent" class="glass-panel neon-glow rounded-3xl p-8 max-w-sm w-full text-center flex flex-col items-center gap-5 animate-pop relative z-10 border border-pink-500/40 bg-gradient-to-b from-gray-900/90 to-purple-950/90">
            <div id="modalHeader" class="text-xs tracking-widest text-pink-400 font-bold uppercase">✨ RESULT ✨</div>
            <div id="resultText" class="text-4xl font-black text-white neon-text break-words w-full py-2"></div>
            <button onclick="closeResultModal()" class="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 shadow-[0_0_20px_rgba(236,72,153,0.6)] transition-all text-sm">
                閉じる (停止)
            </button>
        </div>
    </div>

    <!-- フッター -->
    <footer class="text-center text-[10px] text-gray-500 z-10 py-1">
        Live Stream Roulette App &copy; 2026
    </footer>

    <script>
        // PWAのサービスワーカー登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {});
        }

        let items = [
            { id: 1, name: "大当たり！", weight: 3, color: "#ec4899", eliminated: false },
            { id: 2, name: "ハズレ…", weight: 2, color: "#8b5cf6", eliminated: false },
            { id: 3, name: "もう一回！", weight: 2, color: "#3b82f6", eliminated: false },
            { id: 4, name: "罰ゲーム", weight: 1, color: "#06b6d4", eliminated: false },
        ];

        let currentAngle = 0;
        let isSpinning = false;
        let targetAngle = 0;
        let startAngleVal = 0;
        let startTime = 0;
        let fireworksAnimId = null;

        // Web Audio API による電子音システム
        let audioCtx = null;
        let lastPlayedAngle = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            const soundToggle = document.getElementById('soundToggle');
            if (!soundToggle || !soundToggle.checked) return; // 効果音OFFなら鳴らさない
            if (!isSpinning) return;
            initAudio();

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {}
        }

        function playWinFanfare() {
            const soundToggle = document.getElementById('soundToggle');
            if (!soundToggle || !soundToggle.checked) return; // 効果音OFFなら鳴らさない
            initAudio();
            try {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.08);
                    gain.gain.setValueAtTime(0.3, now + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + index * 0.08);
                    osc.stop(now + index * 0.08 + 0.3);
                });
            } catch (e) {}
        }

        // 音声合成インスタンスの保持
        let currentUtterance = null;

        function speakResult(text) {
            const speechToggle = document.getElementById('speechToggle');
            if (!speechToggle || !speechToggle.checked) return; // 読み上げOFFなら喋らない
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel();

            setTimeout(() => {
                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.lang = 'ja-JP';
                currentUtterance.rate = 1.1;
                currentUtterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const jpVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP');
                if (jpVoice) {
                    currentUtterance.voice = jpVoice;
                }

                window.speechSynthesis.speak(currentUtterance);
            }, 50);
        }

        function testSpeech() {
            initAudio();
            speakResult("音声読み上げのテストです。");
        }

        // オートスピン用変数
        let isAutoSpinning = false;
        let isInfinite = false;
        let remainingAutoCount = 0;
        let nextSpinTimer = null;

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const colors = ["#ec4899", "#8b5cf6", "#3b82f6", "#06b6d4", "#10b981", "#f59e0b", "#ef4444", "#6366f1"];

        function drawRoulette() {
            const activeItems = items.filter(i => !i.eliminated);
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            ctx.clearRect(0, 0, width, height);

            if (activeItems.length === 0) {
                ctx.fillStyle = '#6b7280';
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                return;
            }

            const totalWeight = activeItems.reduce((sum, item) => sum + item.weight, 0);
            let startAngle = currentAngle;

            activeItems.forEach((item, index) => {
                const sliceAngle = (item.weight / totalWeight) * Math.PI * 2;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(item.name.length > 9 ? item.name.substring(0, 8) + '…' : item.name, radius - 18, 4.5);
                ctx.restore();

                startAngle = endAngle;
            });
        }

        function updateUI() {
            const listEl = document.getElementById('itemList');
            const countEl = document.getElementById('itemCount');
            listEl.innerHTML = '';
            countEl.textContent = `${items.length}件`;
            items.forEach((item) => {
                const row = document.createElement('div');
                row.className = `flex items-center justify-between gap-2 p-2 rounded-xl bg-black/30 border border-white/5 transition-opacity ${item.eliminated ? 'opacity-40' : ''}`;
                row.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <input type="color" value="${item.color}" onchange="updateItemColor(${item.id}, this.value)" class="w-6 h-6 rounded border-0 cursor-pointer bg-transparent shrink-0">
                        <span class="text-xs md:text-sm font-medium truncate ${item.eliminated ? 'line-through text-gray-500' : 'text-gray-200'}">${item.name}</span>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span class="text-[10px] text-gray-400">重み:</span>
                        <input type="number" value="${item.weight}" min="1" max="100" onchange="updateItemWeight(${item.id}, this.value)" class="w-12 bg-black/50 border border-white/10 rounded-lg text-center text-xs py-1 text-white">
                        <button onclick="toggleEliminate(${item.id})" class="px-2 py-1 rounded-lg text-xs ${item.eliminated ? 'bg-green-600/40 text-green-300' : 'bg-yellow-600/30 text-yellow-300'} hover:opacity-80">${item.eliminated ? '復元' : '除外'}</button>
                        <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-300 px-1.5 py-1 text-xs">✕</button>
                    </div>`;
                listEl.appendChild(row);
            });
            drawRoulette();
        }

        function addItem() {
            const nameInput = document.getElementById('newItemName');
            const weightInput = document.getElementById('newItemWeight');
            const name = nameInput.value.trim();
            const weight = parseInt(weightInput.value) || 1;
            if (!name) return;
            items.push({ id: items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1, name, weight, color: colors[items.length % colors.length], eliminated: false });
            nameInput.value = '';
            weightInput.value = '1';
            updateUI();
        }

        function deleteItem(id) { items = items.filter(i => i.id !== id); updateUI(); }
        function toggleEliminate(id) { const item = items.find(i => i.id === id); if (item) { item.eliminated = !item.eliminated; updateUI(); } }
        function resetEliminated() { items.forEach(i => i.eliminated = false); updateUI(); }
        function updateItemWeight(id, val) { const item = items.find(i => i.id === id); if (item) { item.weight = Math.max(1, parseInt(val) || 1); updateUI(); } }
        function updateItemColor(id, val) { const item = items.find(i => i.id === id); if (item) { item.color = val; drawRoulette(); } }

        function handleSpinClick() {
            initAudio();
            if (isAutoSpinning) {
                stopAutoSpin();
                return;
            }
            startSpin();
        }

        function startSpin() {
            if (isSpinning) return;

            const activeItems = items.filter(i => !i.eliminated);
            if (activeItems.length === 0) return;

            isSpinning = true;
            document.getElementById('centerSpinBtn').disabled = true;

            targetAngle = currentAngle + (5 + Math.random() * 5) * Math.PI * 2 + Math.random() * Math.PI * 2;
            startAngleVal = currentAngle;
            lastPlayedAngle = currentAngle;
            startTime = performance.now();
            requestAnimationFrame(animateSpin);
        }

        function animateSpin(currentTime) {
            if (!isSpinning) return;

            const elapsed = currentTime - startTime;
            const duration = 2000;
            const progress = Math.min(elapsed / duration, 1);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            currentAngle = startAngleVal + (targetAngle - startAngleVal) * easeOut;
            
            const angleStep = 0.35;
            if (Math.abs(currentAngle - lastPlayedAngle) >= angleStep) {
                playTickSound();
                lastPlayedAngle = currentAngle;
            }

            drawRoulette();

            if (progress < 1) {
                requestAnimationFrame(animateSpin);
            } else {
                isSpinning = false;
                document.getElementById('centerSpinBtn').disabled = false;
                determineWinner();
            }
        }

        function determineWinner() {
            isSpinning = false;
            const activeItems = items.filter(i => !i.eliminated);
            if (activeItems.length === 0) return;
            const totalWeight = activeItems.reduce((sum, item) => sum + item.weight, 0);
            
            const pointerAngle = -Math.PI / 2;
            let normalizedAngle = (pointerAngle - (currentAngle % (Math.PI * 2))) % (Math.PI * 2);
            if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

            let currentSliceStart = 0;
            for (let item of activeItems) {
                const sliceAngle = (item.weight / totalWeight) * Math.PI * 2;
                const currentSliceEnd = currentSliceStart + sliceAngle;
                
                if (normalizedAngle >= currentSliceStart && normalizedAngle < currentSliceEnd) {
                    showResultModal(item);
                    return;
                }
                currentSliceStart = currentSliceEnd;
            }
            showResultModal(activeItems[0]);
        }

        function showResultModal(item) {
            isSpinning = false;
            playWinFanfare();
            speakResult(item.name);
            
            const headerEl = document.getElementById('modalHeader');
            if (isAutoSpinning) {
                if (isInfinite) {
                    headerEl.textContent = `✨ AUTO (無限モード) ✨`;
                } else {
                    headerEl.textContent = `✨ AUTO (残り ${remainingAutoCount}回) ✨`;
                }
            } else {
                headerEl.textContent = "✨ RESULT ✨";
            }

            document.getElementById('resultText').textContent = item.name;
            document.getElementById('modalContent').style.borderColor = item.color;
            document.getElementById('resultModal').classList.remove('hidden');
            startFireworks();

            if (isAutoSpinning) {
                if (nextSpinTimer) clearTimeout(nextSpinTimer);
                
                nextSpinTimer = setTimeout(() => {
                    document.getElementById('resultModal').classList.add('hidden');
                    stopFireworks();

                    if (isInfinite || remainingAutoCount > 1) {
                        if (!isInfinite) remainingAutoCount--;
                        
                        nextSpinTimer = setTimeout(() => {
                            if (isAutoSpinning) {
                                startSpin();
                            }
                        }, 300);
                    } else {
                        stopAutoSpin();
                    }
                }, 1000);
            }
        }

        function closeResultModal() {
            isSpinning = false;
            if (nextSpinTimer) clearTimeout(nextSpinTimer);
            if (isAutoSpinning) {
                stopAutoSpin();
            }
            document.getElementById('resultModal').classList.add('hidden');
            stopFireworks();
        }

        function toggleInfiniteMode() {
            isInfinite = !isInfinite;
            const btn = document.getElementById('infiniteToggleBtn');
            const input = document.getElementById('autoCountInput');
            
            if (isInfinite) {
                btn.textContent = "∞ 無限: ON";
                btn.className = "px-3 py-1.5 rounded-lg border border-purple-500 text-xs font-bold text-purple-300 bg-purple-900/40 hover:bg-purple-900/60 transition-all shrink-0";
                input.disabled = true;
                input.classList.add('opacity-40');
            } else {
                btn.textContent = "∞ 無限: OFF";
                btn.className = "px-3 py-1.5 rounded-lg border border-white/10 text-xs font-bold text-gray-300 bg-black/40 hover:bg-white/10 transition-all shrink-0";
                input.disabled = false;
                input.classList.remove('opacity-40');
            }
        }

        function toggleAutoSpin() {
            initAudio();
            if (isAutoSpinning) {
                stopAutoSpin();
            } else {
                const count = isInfinite ? 999999 : parseInt(document.getElementById('autoCountInput').value) || 1;
                startAutoSpin(count);
            }
        }

        function startAutoSpin(count) {
            const activeItems = items.filter(i => !i.eliminated);
            if (activeItems.length === 0) return;

            isAutoSpinning = true;
            remainingAutoCount = count;
            
            const btn = document.getElementById('autoSpinBtn');
            btn.textContent = "🛑 停止する";
            btn.className = "bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-400 hover:to-pink-500 text-white px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold transition-all shrink-0";
            
            document.getElementById('autoCountInput').disabled = true;

            startSpin();
        }

        function stopAutoSpin() {
            isSpinning = false;
            isAutoSpinning = false;
            remainingAutoCount = 0;
            if (nextSpinTimer) clearTimeout(nextSpinTimer);

            const btn = document.getElementById('autoSpinBtn');
            btn.textContent = "自動スタート";
            btn.className = "bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold transition-all shrink-0";
            
            if (!isInfinite) {
                document.getElementById('autoCountInput').disabled = false;
            }
            document.getElementById('resultModal').classList.add('hidden');
            stopFireworks();
        }

        function startFireworks() {
            const fwCanvas = document.getElementById('fireworksCanvas');
            const fwCtx = fwCanvas.getContext('2d');
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
            let particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: fwCanvas.width / 2,
                    y: fwCanvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    size: Math.random() * 4 + 2
                });
            }
            function loop() {
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.alpha -= 0.015;
                    if (p.alpha > 0) {
                        fwCtx.save();
                        fwCtx.globalAlpha = p.alpha;
                        fwCtx.fillStyle = p.color;
                        fwCtx.beginPath();
                        fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        fwCtx.fill();
                        fwCtx.restore();
                    }
                });
                fireworksAnimId = requestAnimationFrame(loop);
            }
            loop();
        }

        function stopFireworks() {
            if (fireworksAnimId) cancelAnimationFrame(fireworksAnimId);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                handleSpinClick();
            }
        });

        updateUI();
    </script>
</body>
</html>
