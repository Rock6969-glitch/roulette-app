<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- STREAM_CHUNK:Configuring Head and Meta Tags... -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weighted Wheel Roulette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');

        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background-color: #070913;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .text-neon {
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.7), 0 0 20px rgba(168, 85, 247, 0.5);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal {
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- STREAM_CHUNK:Configuring Header... -->
    <header class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-600 via-purple-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-pink-500/30">
                <i class="fa-solid fa-chart-pie animate-pulse"></i>
            </div>
            <div>
                <h1 class="text-base font-black tracking-tight bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-400 bg-clip-text text-transparent">
                    Weight Roulette <span class="text-[10px] px-1.5 py-0.5 rounded bg-pink-500/20 text-pink-300 border border-pink-500/30">PRO</span>
                </h1>
                <p class="text-[10px] text-slate-400">重み可変・扇状セクター対応</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="toggleAudioBtn" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/80 flex items-center justify-center text-slate-300 active:scale-95 transition">
                <i id="audioIcon" class="fa-solid fa-volume-high text-emerald-400 text-sm"></i>
            </button>
            <button id="openSidebarBtn" class="w-9 h-9 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 flex items-center justify-center text-white shadow-md shadow-purple-900/40 active:scale-95 transition">
                <i class="fa-solid fa-sliders text-sm"></i>
            </button>
        </div>
    </header>

    <!-- STREAM_CHUNK:Rendering Main Wheel Stage... -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col items-center justify-center relative">
        
        <!-- Top Pointer Triangle -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 z-20 filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.6)]">
            <div class="w-8 h-10 bg-gradient-to-b from-yellow-300 via-amber-400 to-orange-500" style="clip-path: polygon(0% 0%, 100% 0%, 50% 100%);"></div>
            <div class="w-3 h-3 bg-amber-100 rounded-full mx-auto -mt-8 shadow-inner"></div>
        </div>

        <!-- Wheel Canvas Container -->
        <div class="relative w-full aspect-square max-w-[340px] flex items-center justify-center my-2">
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-pink-500/30 animate-spin" style="animation-duration: 40s;"></div>
            
            <canvas id="rouletteCanvas" width="600" height="600" class="w-full h-full rounded-full cursor-pointer shadow-[0_10px_30px_rgba(0,0,0,0.6)] border-4 border-slate-800"></canvas>

            <!-- Center SPIN Button -->
            <button id="spinBtn" class="absolute z-30 w-20 h-20 rounded-full bg-gradient-to-tr from-pink-600 via-rose-500 to-amber-400 p-1 shadow-[0_0_25px_rgba(244,63,94,0.6)] active:scale-90 transition transform flex flex-col items-center justify-center text-white border-4 border-slate-900">
                <span class="text-lg font-black tracking-widest leading-none">SPIN</span>
                <span class="text-[9px] font-bold text-pink-100 mt-0.5">回す</span>
            </button>
        </div>

        <!-- Quick Toolbar below Wheel -->
        <div class="w-full flex items-center justify-between gap-2 mt-4 px-1">
            <div class="text-xs text-slate-400 bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5">
                <i class="fa-solid fa-scale-balanced text-pink-400"></i> 総確率重み: <span id="quickTotalWeight" class="text-white font-bold">0</span>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-800 text-xs">
                <span class="text-slate-400 text-[10px]">自動除外:</span>
                <input type="checkbox" id="autoRemoveQuickCheck" class="w-4 h-4 rounded accent-pink-500 cursor-pointer">
            </div>
        </div>
    </main>

    <!-- STREAM_CHUNK:Configuring Sidebar Drawer for Direct Add, Edit and Weights... -->
    <div id="sidebarOverlay" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm transition-opacity opacity-0 pointer-events-none duration-300">
        <div id="sidebarDrawer" class="absolute top-0 right-0 bottom-0 w-full max-w-xs bg-slate-950 border-l border-slate-800 flex flex-col p-4 shadow-2xl transform translate-x-full transition-transform duration-300 overflow-y-auto">
            
            <!-- Drawer Header -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <h2 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-pink-400"></i> セクター・重み設定
                </h2>
                <button id="closeSidebarBtn" class="w-8 h-8 rounded-lg bg-slate-900 text-slate-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Tab Navigation for Drawer -->
            <div class="flex bg-slate-900 p-1 rounded-xl mb-4 border border-slate-800 text-xs">
                <button id="tabItemsNav" class="flex-1 py-2 rounded-lg font-bold bg-pink-600 text-white shadow transition">項目 (<span id="itemCountBadge">0</span>)</button>
                <button id="tabPresetsNav" class="flex-1 py-2 rounded-lg font-bold text-slate-400 transition">プリセット</button>
                <button id="tabHistoryNav" class="flex-1 py-2 rounded-lg font-bold text-slate-400 transition">履歴</button>
            </div>

            <!-- TAB 1: Items Editor with Direct Add & Sliders -->
            <div id="tabContentItems" class="flex flex-col gap-3">
                <!-- Add Form -->
                <form id="addItemForm" class="flex gap-2">
                    <input type="text" id="newItemText" placeholder="新しい項目名..." required
                           class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-pink-500">
                    <input type="number" id="newItemWeight" value="10" min="1" max="100" title="重み(大きさ)"
                           class="w-14 bg-slate-900 border border-slate-800 rounded-xl text-center text-xs font-bold text-pink-400 focus:outline-none focus:border-pink-500">
                    <button type="submit" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </form>

                <p class="text-[11px] text-slate-400 px-1">
                    <i class="fa-solid fa-circle-info text-cyan-400 mr-1"></i>重み（数値）を大きくすると、ルーレット上の扇状の枠が広くなり当選しやすくなります。
                </p>

                <!-- Items Container List -->
                <div id="itemsListContainer" class="max-h-[300px] overflow-y-auto flex flex-col gap-2.5 my-1 pr-1">
                    <!-- Dynamically injected items -->
                </div>

                <div class="pt-2 border-t border-slate-900 flex justify-between">
                    <button id="normalizeWeightsBtn" class="text-[11px] text-cyan-400 hover:text-cyan-300 py-1 px-2 rounded">
                        <i class="fa-solid fa-arrows-split-up-and-left mr-1"></i>重みを平均化
                    </button>
                    <button id="clearAllItemsBtn" class="text-[11px] text-rose-400 hover:text-rose-300 py-1 px-2 rounded">
                        <i class="fa-solid fa-trash-can mr-1"></i>すべて削除
                    </button>
                </div>
            </div>

            <!-- TAB 2: Presets -->
            <div id="tabContentPresets" class="hidden flex flex-col gap-2.5">
                <p class="text-[11px] text-slate-400 mb-1">重みバランス付きプリセット:</p>
                <button class="preset-card text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-bold text-pink-300 transition flex items-center justify-between" data-preset="gacha">
                    <span>💎 ガチャ確率風 (SSR極小, N多め)</span> <i class="fa-solid fa-chevron-right text-slate-600 text-[10px]"></i>
                </button>
                <button class="preset-card text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-bold text-amber-300 transition flex items-center justify-between" data-preset="penalty">
                    <span>👑 配信罰ゲーム (大凶大きめ)</span> <i class="fa-solid fa-chevron-right text-slate-600 text-[10px]"></i>
                </button>
                <button class="preset-card text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-bold text-emerald-300 transition flex items-center justify-between" data-preset="equal">
                    <span>⚖️ 均等ルーレット (重み1ずつ)</span> <i class="fa-solid fa-chevron-right text-slate-600 text-[10px]"></i>
                </button>
            </div>

            <!-- TAB 3: History -->
            <div id="tabContentHistory" class="hidden flex flex-col gap-2">
                <div class="flex items-center justify-between text-xs text-slate-400 pb-1">
                    <span>当選履歴</span>
                    <button id="clearHistoryBtn" class="text-rose-400 text-[11px]">クリア</button>
                </div>
                <div id="historyListContainer" class="max-h-[320px] overflow-y-auto flex flex-col gap-1.5">
                    <div class="text-center py-6 text-slate-600 text-xs">履歴はありません</div>
                </div>
            </div>

        </div>
    </div>

    <!-- STREAM_CHUNK:Winner Announcement Modal... -->
    <div id="winnerModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="glass-card max-w-xs w-full p-6 rounded-3xl border-2 border-pink-500/50 text-center animate-modal relative overflow-hidden shadow-[0_0_40px_rgba(236,72,153,0.4)]">
            <div class="absolute -top-16 -left-16 w-32 h-32 bg-pink-500/30 rounded-full blur-2xl"></div>
            
            <div class="inline-block px-3 py-1 rounded-full bg-pink-500/20 border border-pink-400/40 text-pink-300 font-bold text-[10px] uppercase tracking-wider mb-2">
                <i class="fa-solid fa-trophy text-amber-400 mr-1"></i> Winner!
            </div>

            <p class="text-xs text-slate-400 font-medium">今回の当選結果は…</p>

            <div id="winnerResultText" class="text-2xl font-black text-white text-neon my-3 break-words leading-tight">
                -
            </div>

            <div class="flex gap-2 mt-5">
                <button id="closeWinnerBtn" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold text-xs shadow-lg shadow-pink-600/30 active:scale-95 transition">
                    閉じる (OK)
                </button>
                <button id="removeWinnerModalBtn" class="px-3 py-2.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold active:scale-95 transition" title="項目から削除">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- STREAM_CHUNK:Initializing JavaScript Engine... -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            tick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(650, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.025);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.025);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.025);
                } catch(e){}
            }
            win() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((f, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = f;
                        const t = this.ctx.currentTime + i * 0.08;
                        const dur = i === 3 ? 0.4 : 0.1;
                        gain.gain.setValueAtTime(0.15, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t);
                        osc.stop(t + dur);
                    });
                } catch(e){}
            }
        }

        const sfx = new SoundEngine();

        const THEME_COLORS = [
            '#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', 
            '#f59e0b', '#ec4899', '#6366f1', '#14b8a6', 
            '#84cc16', '#eab308', '#a855f7', '#3b82f6'
        ];

        let items = [
            { id: 1, text: '大当り (SSR)', weight: 5, color: '#f43f5e' },
            { id: 2, text: '中当たり (SR)', weight: 15, color: '#8b5cf6' },
            { id: 3, text: 'あたり (R)', weight: 30, color: '#06b6d4' },
            { id: 4, text: 'はずれ (N)', weight: 50, color: '#10b981' }
        ];

        let history = [];
        let isSpinning = false;
        let currentAngle = 0;
        let lastWinner = null;

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const itemsListContainer = document.getElementById('itemsListContainer');
        const addItemForm = document.getElementById('addItemForm');
        const newItemText = document.getElementById('newItemText');
        const newItemWeight = document.getElementById('newItemWeight');
        const itemCountBadge = document.getElementById('itemCountBadge');
        const quickTotalWeight = document.getElementById('quickTotalWeight');
        const winnerModal = document.getElementById('winnerModal');
        const winnerResultText = document.getElementById('winnerResultText');
        const autoRemoveQuickCheck = document.getElementById('autoRemoveQuickCheck');

        function drawWheel() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = w / 2 - 15;

            ctx.clearRect(0, 0, w, h);

            if (items.length === 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 20px "Outfit", "Noto Sans JP", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('項目を追加してね', cx, cy);
                return;
            }

            const totalWeight = items.reduce((sum, item) => sum + Math.max(1, Number(item.weight) || 1), 0);
            let startAngle = currentAngle;

            items.forEach((item, index) => {
                const weight = Math.max(1, Number(item.weight) || 1);
                const sliceAngle = (weight / totalWeight) * 2 * Math.PI;
                const endAngle = startAngle + sliceAngle;

                // Draw sector arc
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = item.color || THEME_COLORS[index % THEME_COLORS.length];
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw label & percentage inside sector
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;

                const fontSize = Math.max(11, Math.min(18, 220 / Math.sqrt(items.length)));
                ctx.font = `bold ${fontSize}px "Outfit", "Noto Sans JP", sans-serif`;

                let label = item.text;
                if (label.length > 9) label = label.substring(0, 8) + '…';

                ctx.fillText(label, radius - 28, 0);
                ctx.restore();

                startAngle = endAngle;
            });

            // Outer border ring
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function renderItemsList() {
            itemsListContainer.innerHTML = '';
            let totalWeight = 0;

            items.forEach((item) => {
                const w = Math.max(1, Number(item.weight) || 1);
                totalWeight += w;
            });

            items.forEach((item) => {
                const w = Math.max(1, Number(item.weight) || 1);
                const percentage = totalWeight > 0 ? ((w / totalWeight) * 100).toFixed(1) : 0;

                const row = document.createElement('div');
                row.className = 'flex flex-col gap-1.5 bg-slate-900 p-2.5 rounded-xl border border-slate-800';
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <input type="color" value="${item.color}" data-id="${item.id}" class="color-picker w-6 h-6 rounded cursor-pointer bg-transparent border-0 p-0">
                        <input type="text" value="${escapeHtml(item.text)}" data-id="${item.id}" class="item-text-input flex-1 bg-transparent border-b border-transparent focus:border-pink-500 text-xs font-bold text-slate-100 focus:outline-none px-1">
                        <button class="delete-item-btn text-slate-500 hover:text-rose-400 p-1 text-xs" data-id="${item.id}">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="flex items-center justify-between gap-2 text-[11px] text-slate-400 pl-8">
                        <div class="flex items-center gap-1.5 flex-1">
                            <span>重み:</span>
                            <input type="range" min="1" max="100" value="${w}" data-id="${item.id}" class="item-range-input flex-1 accent-pink-500 cursor-pointer">
                        </div>
                        <div class="flex items-center gap-1">
                            <input type="number" min="1" max="1000" value="${w}" data-id="${item.id}" class="item-weight-input w-12 text-center bg-slate-800 rounded text-xs font-bold text-pink-400 focus:outline-none py-0.5">
                            <span class="text-[10px] text-cyan-400 w-10 text-right">(${percentage}%)</span>
                        </div>
                    </div>
                `;
                itemsListContainer.appendChild(row);
            });

            itemCountBadge.textContent = items.length;
            quickTotalWeight.textContent = totalWeight;
            drawWheel();
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function spinWheel() {
            if (isSpinning || items.length === 0) return;

            sfx.init();
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');

            const durationSec = 4;
            const totalWeight = items.reduce((sum, item) => sum + Math.max(1, Number(item.weight) || 1), 0);

            let randomWeight = Math.random() * totalWeight;
            let winningIndex = 0;
            for (let i = 0; i < items.length; i++) {
                randomWeight -= Math.max(1, Number(items[i].weight) || 1);
                if (randomWeight <= 0) {
                    winningIndex = i;
                    break;
                }
            }

            let accumulatedAngle = 0;
            for (let i = 0; i < winningIndex; i++) {
                accumulatedAngle += (Math.max(1, Number(items[i].weight) || 1) / totalWeight) * 2 * Math.PI;
            }
            const winnerSliceAngle = (Math.max(1, Number(items[winningIndex].weight) || 1) / totalWeight) * 2 * Math.PI;
            const targetSliceCenter = accumulatedAngle + winnerSliceAngle / 2;
            const pointerAngle = 1.5 * Math.PI; // Top
            let desiredFinalAngle = pointerAngle - targetSliceCenter;

            const fullRotations = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
            const totalTargetRotation = currentAngle + fullRotations + (desiredFinalAngle - (currentAngle % (2 * Math.PI)));

            const startTime = performance.now();
            const startAngleVal = currentAngle;
            let lastTickSlice = -1;

            function animate(currentTime) {
                const elapsed = (currentTime - startTime) / 1000;
                const progress = Math.min(elapsed / durationSec, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);

                currentAngle = startAngleVal + (totalTargetRotation - startAngleVal) * easeOut;

                const currentSliceIndex = Math.floor(((currentAngle % (2 * Math.PI)) / (2 * Math.PI)) * items.length);
                if (currentSliceIndex !== lastTickSlice) {
                    sfx.tick();
                    lastTickSlice = currentSliceIndex;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50');

                    const winner = items[winningIndex];
                    lastWinner = winner;
                    showWinner(winner);
                }
            }

            requestAnimationFrame(animate);
        }

        function showWinner(item) {
            winnerResultText.textContent = item.text;
            winnerModal.classList.remove('hidden');
            sfx.win();

            try {
                confetti({ particleCount: 75, spread: 70, origin: { y: 0.6 } });
            } catch(e){}

            const timeStr = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            history.unshift({ text: item.text, time: timeStr });
            renderHistory();

            if (autoRemoveQuickCheck.checked) {
                setTimeout(() => removeItem(item.id), 800);
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyListContainer');
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-600 text-xs">履歴はありません</div>`;
                return;
            }
            container.innerHTML = history.map((h, i) => `
                <div class="flex items-center justify-between bg-slate-900 p-2 rounded-xl text-xs border border-slate-800">
                    <span class="font-bold text-slate-200">#${history.length - i}. ${escapeHtml(h.text)}</span>
                    <span class="text-slate-500 text-[10px]">${h.time}</span>
                </div>
            `).join('');
        }

        function removeItem(id) {
            items = items.filter(i => i.id !== id);
            renderItemsList();
        }

        // Event Listeners
        spinBtn.addEventListener('click', spinWheel);
        canvas.addEventListener('click', spinWheel);

        addItemForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = newItemText.value.trim();
            const weight = Math.max(1, parseInt(newItemWeight.value) || 10);
            if (text) {
                items.push({ id: Date.now(), text, weight, color: THEME_COLORS[items.length % THEME_COLORS.length] });
                newItemText.value = '';
                renderItemsList();
            }
        });

        itemsListContainer.addEventListener('input', (e) => {
            const id = Number(e.target.dataset.id);
            const item = items.find(i => i.id === id);
            if (!item) return;

            if (e.target.classList.contains('item-text-input')) {
                item.text = e.target.value;
            }
            if (e.target.classList.contains('item-weight-input') || e.target.classList.contains('item-range-input')) {
                const val = Math.max(1, parseInt(e.target.value) || 1);
                item.weight = val;
                const row = e.target.closest('div.bg-slate-900');
                if (row) {
                    const range = row.querySelector('.item-range-input');
                    const num = row.querySelector('.item-weight-input');
                    if (range) range.value = val;
                    if (num) num.value = val;
                }
            }
            if (e.target.classList.contains('color-picker')) {
                item.color = e.target.value;
            }
            renderItemsList();
        });

        itemsListContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.delete-item-btn');
            if (btn) removeItem(Number(btn.dataset.id));
        });

        document.getElementById('clearAllItemsBtn').addEventListener('click', () => {
            if (confirm('すべての項目を削除しますか？')) {
                items = [];
                renderItemsList();
            }
        });

        document.getElementById('normalizeWeightsBtn').addEventListener('click', () => {
            items.forEach(i => i.weight = 10);
            renderItemsList();
        });

        // Sidebar Drawer Controls
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarDrawer = document.getElementById('sidebarDrawer');

        function openSidebar() {
            sidebarOverlay.classList.remove('opacity-0', 'pointer-events-none');
            sidebarDrawer.classList.remove('translate-x-full');
        }
        function closeSidebar() {
            sidebarOverlay.classList.add('opacity-0', 'pointer-events-none');
            sidebarDrawer.classList.add('translate-x-full');
        }

        document.getElementById('openSidebarBtn').addEventListener('click', openSidebar);
        document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', (e) => {
            if (e.target === sidebarOverlay) closeSidebar();
        });

        // Tab Navigation inside Drawer
        const tabItemsNav = document.getElementById('tabItemsNav');
        const tabPresetsNav = document.getElementById('tabPresetsNav');
        const tabHistoryNav = document.getElementById('tabHistoryNav');
        const tabContentItems = document.getElementById('tabContentItems');
        const tabContentPresets = document.getElementById('tabContentPresets');
        const tabContentHistory = document.getElementById('tabContentHistory');

        function switchTab(activeNav, activeContent) {
            [tabItemsNav, tabPresetsNav, tabHistoryNav].forEach(n => n.className = 'flex-1 py-2 rounded-lg font-bold text-slate-400 transition');
            activeNav.className = 'flex-1 py-2 rounded-lg font-bold bg-pink-600 text-white shadow transition';

            [tabContentItems, tabContentPresets, tabContentHistory].forEach(c => c.classList.add('hidden'));
            activeContent.classList.remove('hidden');
        }

        tabItemsNav.addEventListener('click', () => switchTab(tabItemsNav, tabContentItems));
        tabPresetsNav.addEventListener('click', () => switchTab(tabPresetsNav, tabContentPresets));
        tabHistoryNav.addEventListener('click', () => switchTab(tabHistoryNav, tabContentHistory));

        // Presets Loading
        const PRESETS = {
            gacha: [
                { text: 'SSR超激レア', weight: 2, color: '#f43f5e' },
                { text: 'SR激レア', weight: 8, color: '#8b5cf6' },
                { text: 'Rレア', weight: 30, color: '#06b6d4' },
                { text: 'Nノーマル', weight: 60, color: '#10b981' }
            ],
            penalty: [
                { text: '大凶（激ムズ）', weight: 50, color: '#f43f5e' },
                { text: '小凶', weight: 30, color: '#f59e0b' },
                { text: 'セーフ！', weight: 20, color: '#10b981' }
            ],
            equal: [
                { text: '項目A', weight: 10, color: '#f43f5e' },
                { text: '項目B', weight: 10, color: '#8b5cf6' },
                { text: '項目C', weight: 10, color: '#06b6d4' },
                { text: '項目D', weight: 10, color: '#10b981' }
            ]
        };

        document.querySelectorAll('.preset-card').forEach(card => {
            card.addEventListener('click', () => {
                const key = card.dataset.preset;
                if (PRESETS[key]) {
                    items = PRESETS[key].map((p, idx) => ({
                        id: Date.now() + idx,
                        text: p.text,
                        weight: p.weight,
                        color: p.color || THEME_COLORS[idx % THEME_COLORS.length]
                    }));
                    renderItemsList();
                    switchTab(tabItemsNav, tabContentItems);
                    closeSidebar();
                }
            });
        });

        document.getElementById('closeWinnerBtn').addEventListener('click', () => winnerModal.classList.add('hidden'));
        document.getElementById('removeWinnerModalBtn').addEventListener('click', () => {
            if (lastWinner) {
                removeItem(lastWinner.id);
                winnerModal.classList.add('hidden');
            }
        });

        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            history = [];
            renderHistory();
        });

        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const audioIcon = document.getElementById('audioIcon');
        toggleAudioBtn.addEventListener('click', () => {
            sfx.enabled = !sfx.enabled;
            audioIcon.className = sfx.enabled ? 'fa-solid fa-volume-high text-emerald-400 text-sm' : 'fa-solid fa-volume-xmark text-rose-400 text-sm';
        });

        window.onload = function() {
            renderItemsList();
            renderHistory();
        };
    </script>
</body>
</html>
